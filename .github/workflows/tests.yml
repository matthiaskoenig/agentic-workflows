name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request
  cancel-in-progress: true

jobs:
  ruff:
    # required by the branch protection, see .github/rulesets/main.json
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check --diff

  ty:
    # required by the branch protection, see .github/rulesets/main.json
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      - run: uv run ty check
        env:
          TY_OUTPUT_FORMAT: github

  tests:
    # required by the branch protection, see .github/rulesets/main.json
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
      - run: uv sync --locked
      # the suite is one site build, which a session fixture shares between the
      # tests, so it runs serially; the durations keep slow tests visible
      - run: uv run pytest --durations=15
