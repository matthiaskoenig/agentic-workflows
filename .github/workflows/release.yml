name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that the release note exists
        run: test -f "release-notes/${{ github.ref_name }}.md"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "release-notes/${{ github.ref_name }}.md"
          draft: false
          prerelease: false
