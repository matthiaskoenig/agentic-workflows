[project]
site_url = "https://matthiaskoenig.github.io/agentic-workflows/"
site_name = "Agentic Workflows"
site_description = "Best practices, workflows and onboarding material for agentic coding."
site_author = "Matthias Koenig"
copyright = "Copyright &copy; 2026 Matthias Koenig"

repo_url = "https://github.com/matthiaskoenig/agentic-workflows"
repo_name = "matthiaskoenig/agentic-workflows"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Introduction" = "introduction.md" },
  { "Getting started" = "getting-started.md" },
  { "Setup checklist" = "setup.md" },
  { "Onboarding a repository" = "onboarding-repository.md" },
  { "Concepts" = [
    { "Harnesses" = "concepts/harnesses.md" },
    { "Models" = "concepts/models.md" },
    { "CLAUDE.md and AGENTS.md" = "concepts/instruction-files.md" },
    { "Skills" = "concepts/skills.md" },
    { "Orchestration" = "concepts/orchestration.md" },
  ] },
  { "Best practices" = [
    { "The development loop" = "best-practices/index.md" },
    { "Token maxing" = "best-practices/context-management.md" },
    { "Engineering standards" = "best-practices/engineering-standards.md" },
    { "Python code" = "best-practices/python.md" },
    { "Repository policies" = "best-practices/repository-policies.md" },
  ] },
  { "Tooling" = "tooling.md" },
  { "Resources" = "resources.md" },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/bot"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/agentic-workflows"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
