[project]
name = "agentic-workflows"
version = "0.1.0"
description = "Best practices, workflows and onboarding material for agentic coding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "zensical>=0.0.62",
    "pytest>=8.3",
    "ruff>=0.14",
    "ty>=0.0.1a",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.src]
include = ["tests"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
